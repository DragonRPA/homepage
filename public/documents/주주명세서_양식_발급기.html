<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주주명세서 양식 및 인쇄 발급기 | (주)드래곤알피에이</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #1e293b;
      font-family: "Malgun Gothic", "맑은 고딕", Dotum, "돋움", sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .editor-panel {
      flex: 1;
      min-width: 340px;
      background: #1e293b;
      color: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      height: fit-content;
      max-height: 90vh;
      overflow-y: auto;
    }
    .editor-panel h2 {
      font-size: 15px;
      color: #38bdf8;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      color: #fff;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .shareholder-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .shareholder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      font-weight: bold;
      color: #38bdf8;
    }
    .btn-delete {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      position: sticky;
      bottom: 0;
      background: #1e293b;
      padding-top: 8px;
    }
    button {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
      flex: 2;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-save {
      background: #059669;
      color: #fff;
      flex: 1.2;
    }
    .btn-save:hover {
      background: #047857;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
      flex: 1;
    }
    .btn-secondary:hover {
      background: #475569;
    }

    /* A4 Paper Sheet */
    .paper-stage {
      flex: 2;
      display: flex;
      justify-content: center;
    }
    .a4-page {
      background: #fff;
      color: #000;
      width: 210mm;
      max-width: 210mm;
      box-sizing: border-box;
      padding: 12mm 12mm;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Document Header */
    .header-table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000;
      margin-bottom: 6px;
      table-layout: fixed;
      box-sizing: border-box;
    }
    .header-table td {
      border: 1.5px solid #000;
      vertical-align: middle;
      box-sizing: border-box;
    }
    .date-box {
      width: 28%;
      text-align: center;
      font-weight: bold;
      font-size: 12.5px;
      padding: 8px 2px;
    }
    .title-box {
      width: 44%;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 12px;
      text-indent: 12px;
      padding: 8px 0;
    }
    .company-box {
      width: 28%;
      padding: 0;
    }
    .company-subtable {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .company-subtable td {
      border: none;
      text-align: center;
    }
    .company-label {
      font-size: 11.5px;
      font-weight: bold;
      border-bottom: 1.5px solid #000 !important;
      padding: 3px 0;
      background: #f8fafc;
    }
    .company-name {
      font-size: 12.5px;
      font-weight: bold;
      padding: 6px 0;
    }

    /* Main Table */
    .main-table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000;
      font-size: 11.5px;
      table-layout: fixed;
      box-sizing: border-box;
    }
    .main-table th, .main-table td {
      border: 1px solid #000;
      padding: 2px 3px;
      box-sizing: border-box;
    }
    .main-table th {
      background: #f8fafc;
      font-size: 10.5px;
      font-weight: 600;
      text-align: center;
      padding: 3px 2px;
    }
    .main-table td {
      height: 24px;
    }
    .addr-row td {
      height: 36px;
      vertical-align: top;
      font-size: 10.5px;
      line-height: 1.3;
      padding: 3px 5px;
    }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .font-mono { font-family: monospace; }

    /* Exact 1-Page A4 Print CSS */
    @page {
      size: A4 portrait;
      margin: 8mm 10mm 8mm 10mm;
    }
    @media print {
      html, body {
        background: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .container {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .paper-stage {
        display: block !important;
        width: 100% !important;
      }
      .a4-page {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        border: none !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      table {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Editor Controls -->
    <div class="editor-panel no-print">
      <h2>
        <span>📄 주주명세서 정보 수정</span>
        <button class="btn-secondary" style="font-size: 11px; padding: 4px 8px;" onclick="addShareholder()">+ 주주 추가</button>
      </h2>
      
      <div class="form-group">
        <label>기준 일자</label>
        <input type="text" id="inputDate" value="2026년 09월 13일 현재" oninput="renderDoc()">
      </div>

      <div class="form-group">
        <label>회사명</label>
        <input type="text" id="inputCompany" value="주식회사 드래곤알피에이" oninput="renderDoc()">
      </div>

      <div id="shareholdersEditorList">
        <!-- Dynamically rendered shareholder forms -->
      </div>

      <div class="btn-group">
        <button class="btn-save" onclick="saveData()">💾 저장하기</button>
        <button class="btn-secondary" onclick="setToday()">오늘 날짜</button>
        <button class="btn-primary" onclick="printDoc()">🖨️ A4 1장 인쇄</button>
      </div>
    </div>

    <!-- A4 Paper Stage -->
    <div class="paper-stage">
      <div class="a4-page">
        <!-- Header -->
        <table class="header-table">
          <tr>
            <td class="date-box" id="docDate">2026년 09월 13일 현재</td>
            <td class="title-box">주주명세서</td>
            <td class="company-box">
              <table class="company-subtable">
                <tr>
                  <td class="company-label">회 사 명</td>
                </tr>
                <tr>
                  <td class="company-name" id="docCompany">주식회사 드래곤알피에이</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Main Table -->
        <table class="main-table">
          <colgroup>
            <col style="width: 12%">
            <col style="width: 19%">
            <col style="width: 14%">
            <col style="width: 10%">
            <col style="width: 10%">
            <col style="width: 15%">
            <col style="width: 8%">
            <col style="width: 8%">
            <col style="width: 4%">
          </colgroup>
          <thead>
            <tr>
              <th>①성 명<br>(회사명)</th>
              <th>②주민등록번호<br>(법인등록번호)</th>
              <th rowspan="2">④전화번호<br>(휴대전화)</th>
              <th colspan="4">지분 또는 출자관계</th>
              <th rowspan="2">⑨<br>대주주<br>와의<br>관계</th>
              <th rowspan="2">비 고</th>
            </tr>
            <tr>
              <th colspan="2">③주 소</th>
              <th>⑤ 주식수</th>
              <th>⑥ 주당<br>액면가액</th>
              <th>⑦ 금 액</th>
              <th>⑧지분율<br>(%)</th>
            </tr>
          </thead>
          <tbody id="docTableBody">
            <!-- Dynamically rendered rows (7 pairs) -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "DRAGON_SHAREHOLDER_HTML_V2";
    let state = {
      baseDate: "2026년 09월 13일 현재",
      companyName: "주식회사 드래곤알피에이",
      shareholders: [
        {
          name: "이정용",
          residentNo: "770617-1019515",
          zipCode: "058-27",
          address: "서울특별시 송파구 동남로11길 26-11 102호(가락동)",
          phone: "010-9224-4097",
          shares: "10,000",
          parValue: "500원",
          totalAmount: "5,000,000원",
          shareRatio: "100",
          relationship: "본인",
          note: ""
        }
      ],
      totalRows: 7
    };

    function loadSavedData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.baseDate) state.baseDate = parsed.baseDate;
          if (parsed.companyName) state.companyName = parsed.companyName;
          if (parsed.shareholders && Array.isArray(parsed.shareholders)) state.shareholders = parsed.shareholders;
        }
      } catch (e) {}
      
      document.getElementById('inputDate').value = state.baseDate;
      document.getElementById('inputCompany').value = state.companyName;
      renderEditor();
      renderDoc();
    }

    function saveData() {
      state.baseDate = document.getElementById('inputDate').value;
      state.companyName = document.getElementById('inputCompany').value;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        alert("💾 주주명세서 정보가 브라우저에 저장되었습니다.");
      } catch (e) {
        alert("저장 실패");
      }
    }

    function renderEditor() {
      const container = document.getElementById('shareholdersEditorList');
      container.innerHTML = '';

      state.shareholders.forEach((sh, idx) => {
        const card = document.createElement('div');
        card.className = 'shareholder-card';
        card.innerHTML = `
          <div class="shareholder-header">
            <span>주주 #${idx + 1} (${sh.name || '미입력'})</span>
            ${state.shareholders.length > 1 ? `<button class="btn-delete" onclick="removeShareholder(${idx})">삭제</button>` : ''}
          </div>
          <div style="display: flex; gap: 6px;">
            <div class="form-group" style="flex: 1;">
              <label>성명</label>
              <input type="text" value="${sh.name}" oninput="updateField(${idx}, 'name', this.value)">
            </div>
            <div class="form-group" style="flex: 1.3;">
              <label>주민번호</label>
              <input type="text" value="${sh.residentNo}" oninput="updateField(${idx}, 'residentNo', this.value)">
            </div>
          </div>
          <div class="form-group">
            <label style="color: #f59e0b;">우편번호</label>
            <input type="text" value="${sh.zipCode}" placeholder="058-27" oninput="updateField(${idx}, 'zipCode', this.value)">
          </div>
          <div class="form-group">
            <label style="color: #f59e0b;">변경 주소</label>
            <textarea rows="2" oninput="updateField(${idx}, 'address', this.value)">${sh.address}</textarea>
          </div>
          <div style="display: flex; gap: 6px;">
            <div class="form-group" style="flex: 1.2;">
              <label>전화번호</label>
              <input type="text" value="${sh.phone}" oninput="updateField(${idx}, 'phone', this.value)">
            </div>
            <div class="form-group" style="flex: 0.8;">
              <label>관계</label>
              <input type="text" value="${sh.relationship}" oninput="updateField(${idx}, 'relationship', this.value)">
            </div>
          </div>
          <div style="display: flex; gap: 6px;">
            <div class="form-group" style="flex: 1;">
              <label>주식수</label>
              <input type="text" value="${sh.shares}" oninput="updateField(${idx}, 'shares', this.value)">
            </div>
            <div class="form-group" style="flex: 1;">
              <label>주당액면가</label>
              <input type="text" value="${sh.parValue}" oninput="updateField(${idx}, 'parValue', this.value)">
            </div>
          </div>
          <div style="display: flex; gap: 6px;">
            <div class="form-group" style="flex: 1.2;">
              <label>총 금액</label>
              <input type="text" value="${sh.totalAmount}" oninput="updateField(${idx}, 'totalAmount', this.value)">
            </div>
            <div class="form-group" style="flex: 0.8;">
              <label>지분율(%)</label>
              <input type="text" value="${sh.shareRatio}" oninput="updateField(${idx}, 'shareRatio', this.value)">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateField(idx, field, val) {
      state.shareholders[idx][field] = val;
      
      // Auto calculation for amount
      if (field === 'shares' || field === 'parValue') {
        const rawShares = parseInt(state.shareholders[idx].shares.replace(/[^0-9]/g, ''), 10);
        const rawPar = parseInt(state.shareholders[idx].parValue.replace(/[^0-9]/g, ''), 10);
        if (!isNaN(rawShares) && !isNaN(rawPar)) {
          state.shareholders[idx].totalAmount = (rawShares * rawPar).toLocaleString() + '원';
        }
      }

      renderDoc();
    }

    function addShareholder() {
      state.shareholders.push({
        name: "",
        residentNo: "",
        zipCode: "",
        address: "",
        phone: "",
        shares: "0",
        parValue: "500원",
        totalAmount: "0원",
        shareRatio: "0",
        relationship: "주주",
        note: ""
      });
      renderEditor();
      renderDoc();
    }

    function removeShareholder(idx) {
      if (state.shareholders.length <= 1) return;
      if (confirm('해당 주주를 삭제하시겠습니까?')) {
        state.shareholders.splice(idx, 1);
        renderEditor();
        renderDoc();
      }
    }

    function renderDoc() {
      state.baseDate = document.getElementById('inputDate').value;
      state.companyName = document.getElementById('inputCompany').value;
      
      document.getElementById('docDate').innerText = state.baseDate;
      document.getElementById('docCompany').innerText = state.companyName;

      const tbody = document.getElementById('docTableBody');
      tbody.innerHTML = '';

      // Render populated shareholders
      state.shareholders.forEach(sh => {
        let phoneDisplay = sh.phone;
        if (sh.phone.includes('-')) {
          const p = sh.phone.split('-');
          phoneDisplay = p.slice(0, 2).join('-') + '<br>-' + (p[2] || '');
        }

        const tr1 = document.createElement('tr');
        tr1.innerHTML = `
          <td class="text-center">${sh.name}</td>
          <td class="text-center font-mono">${sh.residentNo}</td>
          <td rowspan="2" class="text-center font-mono">${phoneDisplay}</td>
          <td rowspan="2" class="text-right font-mono">${sh.shares}</td>
          <td rowspan="2" class="text-right font-mono">${sh.parValue}</td>
          <td rowspan="2" class="text-right font-mono" style="font-weight: 600;">${sh.totalAmount}</td>
          <td rowspan="2" class="text-center font-mono">${sh.shareRatio}</td>
          <td rowspan="2" class="text-center">${sh.relationship}</td>
          <td rowspan="2" class="text-center">${sh.note}</td>
        `;

        const tr2 = document.createElement('tr');
        tr2.className = 'addr-row';
        tr2.innerHTML = `
          <td colspan="2">
            ${sh.zipCode ? `<div class="font-mono" style="font-size: 10px;">${sh.zipCode}</div>` : ''}
            <div>${sh.address}</div>
          </td>
        `;

        tbody.appendChild(tr1);
        tbody.appendChild(tr2);
      });

      // Render empty slots to make total 7 rows (A4 1 page)
      const emptyCount = Math.max(0, state.totalRows - state.shareholders.length);
      for (let i = 0; i < emptyCount; i++) {
        const tr1 = document.createElement('tr');
        tr1.innerHTML = `
          <td>&nbsp;</td><td>&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td><td rowspan="2">&nbsp;</td>
        `;
        const tr2 = document.createElement('tr');
        tr2.className = 'addr-row';
        tr2.innerHTML = `<td colspan="2">&nbsp;</td>`;

        tbody.appendChild(tr1);
        tbody.appendChild(tr2);
      }
    }

    function setToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      document.getElementById('inputDate').value = `${y}년 ${m}월 ${d}일 현재`;
      renderDoc();
    }

    function printDoc() {
      saveData();
      window.print();
    }

    // Initialize
    loadSavedData();
  </script>
</body>
</html>
